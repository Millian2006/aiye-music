(()=>{const by=id=>document.getElementById(id);const artwork=JSON.parse(by('pictures').textContent);let model=JSON.parse(by('library').textContent);const normalizeGenre=v=>{const t=String(v||'').normalize('NFKC').trim();return /^(r[& ]?b|rnb)$/i.test(t)?'R&B':t};model.songs.forEach(s=>s.genre=normalizeGenre(s.genre));let genre='',chosen=null;const groups=['说唱','甜歌','古风','摇滚','R&B','流行','外文','原唱'];by('banner').src=artwork.banner;function notify(s){by('notice').textContent=s;clearTimeout(notify.timer);notify.timer=setTimeout(()=>by('notice').textContent='',2600)}function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function options(node,values,first){const prev=node.value;node.replaceChildren(new Option(first,''),...values.map(v=>new Option(v,v)));if(values.includes(prev))node.value=prev}function refresh(){options(by('initial'),[...new Set(model.songs.map(s=>s.initial).filter(Boolean))].sort(),'全部首字母');options(by('genreField'),groups,'请选择曲风');render();if(!by('artistMenu').hidden)renderArtistMenu()}function list(){const q=by('query').value.trim().toLowerCase();let a=model.songs.filter(s=>(!genre||s.genre===genre)&&(!by('initial').value||s.initial===by('initial').value)&&(!q||[s.title,s.artist,s.pinyin].some(v=>(v||'').toLowerCase().includes(q))));const sort=by('sort').value;if(sort!=='original')a.sort((x,y)=>(x[sort]||'').localeCompare(y[sort]||'','zh'));return a}async function copy(t){try{await navigator.clipboard.writeText(t);notify('已复制：'+t)}catch{const n=el('textarea');n.value=t;document.body.append(n);n.select();const ok=document.execCommand('copy');n.remove();notify(ok?'已复制：'+t:'复制失败，请手动复制')}}function render(){const a=list();by('count').textContent=`${genre||'全部歌曲'} · ${a.length} 首 / 共 ${model.songs.length} 首`;const frag=document.createDocumentFragment();a.forEach((s,i)=>{const card=el('article',undefined,'song');card.append(el('small',String(i+1)),el('h3',s.title),el('p',s.artist||'待补充'),el('span',s.genre,'tag'));const b=el('button','复制歌名');b.onclick=()=>copy(s.title);card.append(b);frag.append(card)});if(!a.length)frag.append(el('p','没有找到歌曲'));by('results').replaceChildren(frag);document.querySelectorAll('nav button[data-genre]').forEach(b=>{b.classList.toggle('active',b.dataset.genre===genre);b.setAttribute('aria-pressed',b.dataset.genre===genre)})}let wheelPool=[],wheelSlots=[],angle=0,spinning=false,frame=0;const canvas=by('wheelCanvas'),ctx=canvas.getContext('2d');const colors=['#d8edf9','#b8d9cb','#eaf5fb','#c6ddeb','#dce8c9','#a9d0e3'];function drawWheel(){const n=wheelSlots.length;ctx.clearRect(0,0,680,680);if(!n)return;const step=2*Math.PI/n;for(let i=0;i<n;i++){const a=angle-Math.PI/2+i*step-step/2;ctx.beginPath();ctx.moveTo(340,340);ctx.arc(340,340,330,a,a+step);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(340,340);ctx.rotate(a+step/2);ctx.fillStyle='#234c65';ctx.font='bold 24px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';const t=Array.from(wheelSlots[i].title);ctx.fillText(t.length>11?t.slice(0,10).join('')+'…':t.join(''),307,0,218);ctx.restore()}}function sample(pool,n){const a=pool.slice();for(let i=0;i<Math.min(n,a.length);i++){const j=i+Math.floor(Math.random()*(a.length-i));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}let celebrationTimer;function clearCelebration(){clearTimeout(celebrationTimer);by("celebration").classList.remove("show");by("celebration").replaceChildren();by("picked").classList.remove("winner")}function celebrate(){clearCelebration();by("picked").classList.add("winner");if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const layer=by("celebration"),palette=["#86c6e8","#76b69c","#e8c875","#f5a9b9","#ffffff","#9cace8"];for(let i=0;i<100;i++){const r=el("i",undefined,"ribbon");for(const [k,v] of Object.entries({x:Math.random()*100+"%",w:5+Math.random()*8+"px",h:12+Math.random()*20+"px",c:palette[i%palette.length],d:2+Math.random()*1.6+"s",delay:Math.random()*.65+"s",drift:(Math.random()-.5)*220+"px",rot:(Math.random()-.5)*1500+"deg"}))r.style.setProperty("--"+k,v);layer.append(r)}layer.classList.add("show");celebrationTimer=setTimeout(()=>{layer.classList.remove("show");layer.replaceChildren()},4500)}function setupWheel(){clearCelebration();cancelAnimationFrame(frame);spinning=false;chosen=null;angle=0;const g=by('wheelScope').value;wheelPool=model.songs.filter(s=>!g||s.genre===g);wheelSlots=sample(wheelPool,10);by('wheelMascot').src=artwork[g||'随机点歌'];by('picked').textContent=wheelPool.length?'点击中心或开始转盘':'此分类暂无歌曲';by('again').disabled=by('wheelCenter').disabled=!wheelPool.length;by('copyPick').disabled=true;by('wheelScope').disabled=false;drawWheel()}function openWheel(g){by('wheelScope').replaceChildren(new Option('全部歌曲',''),...groups.map(x=>new Option(x,x)));by('wheelScope').value=g;setupWheel();by('random').showModal();by('wheelScroll').scrollTop=0}function pick(){if(spinning||!wheelPool.length)return;clearCelebration();spinning=true;chosen=null;by('again').disabled=by('wheelCenter').disabled=by('copyPick').disabled=by('wheelScope').disabled=true;by('wheelScroll').scrollTop=0;by('picked').textContent='正在转动…';wheelSlots=sample(wheelPool,10);const idx=Math.floor(Math.random()*wheelSlots.length),step=2*Math.PI/wheelSlots.length;const tau=2*Math.PI;angle=0;const target=5*tau+(tau-idx*step)%tau;const begin=performance.now(),duration=matchMedia('(prefers-reduced-motion: reduce)').matches?1:4200;function tick(now){const t=Math.min(1,(now-begin)/duration);angle=target*(1-Math.pow(1-t,4));drawWheel();if(t<1){frame=requestAnimationFrame(tick);return}chosen=wheelSlots[idx];spinning=false;const result=by('picked');result.replaceChildren();for(const [cls,value] of [['win-label','✦ 恭喜抽中！'],['win-title',chosen.title],['win-artist',chosen.artist||'待补充']]){const span=document.createElement('span');span.className=cls;span.textContent=value;result.append(span)}b function renderArtistMenu(){const menu=by('artistMenu'),q=by('query').value.trim().toLowerCase();const names=[...new Set(model.songs.map(s=>s.artist).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));const matches=names.filter(n=>!q||n.toLowerCase().includes(q));const frag=document.createDocumentFragment();const all=el('button','全部歌手（清空搜索）');all.type='button';all.onclick=()=>{by('query').value='';closeArtistMenu();render()};frag.append(all);if(!matches.length)frag.append(el('p','没有匹配的歌手，可清空搜索查看全部歌手。'));for(const name of matches){const b=el('button',name);b.type='button';b.onclick=()=>{by('query').value=name;closeArtistMenu();render()};frag.append(b)}menu.replaceChildren(frag);menu.scrollTop=0}

by('artistToggle').onclick=()=>{if(by('artistMenu').hidden)openArtistMenu();else closeArtistMenu()};by('query').oninput=()=>{render();if(!by('artistMenu').hidden)renderArtistMenu()};by('query').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();if(by('artistMenu').hidden)openArtistMenu();by('artistMenu').querySelector('button')?.focus()}else if(e.key==='Escape'&&!by('artistMenu').hidden){e.preventDefault();closeArtistMenu()}});by('searchWrap').addEventListener('keydown',e=>{if(e.key==='Escape'&&!by('artistMenu').hidden){e.preventDefault();closeArtistMenu();by('query').focus()}else if((e.key==='ArrowDown'||e.key==='ArrowUp')&&by('artistMenu').contains(e.target)){e.preventDefault();const buttons=[...by('artistMenu').querySelectorAll('button')];const i=buttons.indexOf(e.target);buttons[(i+(e.key==='ArrowDown'?1:buttons.length-1))%buttons.length]?.focus()}});document.addEventListener('click',e=>{if(!by('searchWrap').contains(e.target))closeArtistMenu()});for(const id of ['sort','initial'])by(id).onchange=render;by('again').onclick=pick;by('copyPick').onclick=()=>{if(chosen)copy(chosen.title)};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>by(b.dataset.close).close());const BASE='https://matlvcjphclqrrdwuiuw.supabase.co', KEY='sb_publishable_mXUMwbGvWbCzrnB3KxH3hw_8j2O7T_V';
let session=null, syncJob=null, cloudReady=false, saving=false, loginBusy=false;
const columns='id,title,artist,genre,initial,pinyin,date,mood';
const norm=v=>String(v||'').normalize('NFKC').trim().toLowerCase();
async function request(path,{method='GET',body,token,headers={}}={}){
 const h={apikey:KEY,...headers}; if(token)h.Authorization='Bearer '+token;if(body!==undefined)h['Content-Type']='application/json';
 const res=await fetch(BASE+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:AbortSignal.timeout(20000)});
 const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=null}
 if(!res.ok){const err=new Error(data?.message||data?.msg||data?.error_description||'请求失败（'+res.status+'）');err.code=data?.code;err.status=res.status;throw err}return data;
}
function cloudStatus(t){by('cloudStatus').textContent=t}
async function sync(){if(syncJob)return syncJob;by('syncNow').disabled=true;syncJob=(async()=>{
 try{let rows=[],last=0;for(;;){const batch=await request('/rest/v1/songs?select='+columns+'&order=id.asc&id=gt.'+last+'&limit=500');if(!Array.isArray(batch))throw Error('数据格式异常');if(!batch.length)break;rows.push(...batch);last=batch[batch.length-1].id;if(batch.length<500)break}
 if(rows.length<1109)throw Error('云端歌单尚未完整');
 const changed=JSON.stringify(rows)!==JSON.stringify(model.songs);model.songs=rows;cloudReady=true;if(changed)refresh();cloudStatus('云端已同步 · '+rows.length+' 首');return true;
 }catch(e){cloudReady=false;cloudStatus('云端连接失败 · 显示 '+model.songs.length+' 首备用歌单，可点击刷新');return false}
 finally{by('syncNow').disabled=false}
 })();try{return await syncJob}finally{syncJob=null}}

 try{const auth=await request('/auth/v1/token?grant_type=password',{method:'POST',body:{email:by('adminEmail').value.trim(),password:by('editPassword').value}});if(!auth?.access_token||auth.user?.app_metadata?.song_admin!==true){session=null;throw Error('该账号没有歌单管理员权限')};session={...auth,expiresAt:Date.now()+Number(auth.expires_in||3600)*1000};by('edit').textContent='🔓 新增歌曲';by('passwordDialog').close();openEditor();await sync()}
 catch(e){by('passwordError').textContent=e.message==='该账号没有歌单管理员权限'?e.message:'登录失败，请检查邮箱、密码及网络连接。'}finally{by('editPassword').value='';loginBusy=false;by('loginSubmit').disabled=false}};
function fields(){let title=by('titleField').value.trim(),artist=by('artistField').value.trim(),genre=normalizeGenre(by('genreField').value),pinyin=by('pinyinField').value.trim().toLowerCase();let initial=by('initialField').value.trim().toUpperCase()||(/^[a-z]/i.test(pinyin||title)?(pinyin||title)[0].toUpperCase():'');return {title,artist,genre,initial,pinyin,date:new Date().toISOString().slice(0,10),mood:'未填写'}}
by('add').onclick=async()=>{if(saving)return;if(!adminValid()){session=null;by('editor').close();openLogin();return}const f=fields(),status=by('editorStatus');if(!f.title||!f.artist||!groups.includes(f.genre)){status.textContent='请填写歌名、歌手，并选择曲风。';return}if(f.initial&&!/^[A-Z]$/.test(f.initial)){status.textContent='首字母请填写 A–Z。';return}saving=true;by('add').disabled=true;by('logout').disabled=true;status.textContent='正在检查云端歌单…';
 try{if(!await sync())throw Error('无法连接云端，未提交歌曲。请刷新后重试。');if(model.songs.some(s=>norm(s.title)===norm(f.title)&&norm(s.artist)===norm(f.artist))){status.textContent='这首歌曲和歌手已经存在，无需重复添加。';return}
 status.textContent='正在保存…';const result=await request('/rest/v1/songs',{method:'POST',body:f,token:session.access_token,headers:{Prefer:'return=representation'}});if(!Array.isArray(result)||result.length!==1)throw Error('未能确认保存，请刷新歌单核实。');model.songs.push(result[0]);refresh();clearFields();const synced=await sync();status.textContent=synced?'已成功新增并同步到云端！':'已保存到云端，但刷新失败，请稍后点击刷新。';notify('已新增歌曲：'+f.title);
 }catch(e){if(e.code==='23505')status.textContent='该歌曲已存在，云端已拦截重复新增。';else if(e.status===401||e.status===403||e.code==='42501'){session=null;by('edit').textContent='🔒 新增歌曲';status.textContent='登录已失效或没有权限，请关闭后重新登录。'}else status.textContent='保存未确认：'+e.message+'（请先刷新确认是否已保存）'}finally{saving=false;by('add').disabled=false;by('logout').disabled=false}};
